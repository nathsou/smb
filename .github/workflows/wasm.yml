name: Check and deploy

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install tested MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s '0.10.17+d971670cd'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install clang with the wasm32 target
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang lld
      - name: Resolve MoonBit dependencies
        run: moon update
      # No ROM here: the recompiled game is checked locally with
      # `python3 tests/check_codegen.py --rom`.
      - name: Analysis tests, fixtures through both backends, map header, runtime
        run: python3 tests/check_codegen.py

  build-and-deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tested MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s '0.10.17+d971670cd'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install clang with the wasm32 target
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang lld
      - name: Resolve MoonBit dependencies
        run: moon update
      # The page recompiles the player's ROM in the browser.
      - name: Build the page
        run: make web
      - name: Prepare deployment
        run: |
          mkdir -p dist
          cp web/*.html web/*.js web/*.frag web/runtime.wasm web/runtime-cartridge.wasm web/apu.wasm web/smb.map web/metroid.map web/smb3.map web/routines.txt web/display.c dist/
          cp -r web/themes dist/
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          # keep no history of earlier deployments on gh-pages
          single-commit: true
          token: ${{ secrets.GITHUB_TOKEN }}
